<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChillDesk · panel</title>
  <link rel="icon" href="/static/brand/mallard.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=16">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <header class="topbar">
    <div class="logo"><span class="logo-mark"><img src="/static/brand/mallard.svg" alt=""></span> ChillDesk</div>
    <span class="pill" id="model">Gemma 4</span>
    <div class="spacer"></div>
        <button class="btn" id="open-analytics"><i data-lucide="chart-pie"></i> Analitika</button>
        <a class="link" href="/">Mallard mağazası</a>
  </header>
  <div class="wrap">
    <section class="kpis" id="kpis"></section>
    <div class="cols">
      <section class="box">
        <h2><i data-lucide="messages-square"></i> Söhbətlər və avtomatik analiz</h2>
        <div id="convs"></div>
      </section>
      <div style="display:grid;gap:20px;align-content:start">
        <section class="box">
          <h2><i data-lucide="ticket"></i> Biletlər</h2>
          <div id="tickets"></div>
        </section>
        <section class="box">
          <h2><i data-lucide="undo-2"></i> Qaytarmalar</h2>
          <div id="returns"></div>
        </section>
        <section class="box">
          <h2><i data-lucide="search-x"></i> Bilik bazasında boşluqlar</h2>
          <div id="gaps"></div>
        </section>
      </div>
    </div>
  </div>
  <section id="analytics" class="analytics" hidden>
    <div class="an-head">
      <div><h2>Analitika</h2><p class="muted">Neon-dakı bütün söhbətlər, biletlər, qaytarmalar və sifarişlər · Gemma 4 analizi</p></div>
      <button class="icon-btn" id="close-analytics" title="Bağla"><i data-lucide="x"></i></button>
    </div>
    <div class="an-grid" id="an-grid"></div>
  </section>
  <script type="module" src="/static/dashboard.js?v=13"></script>
</body>
</html>
